<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanoun Agouni N'Teselent (1892) - Numérisé</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #c0392b;
            --bg: #f4f4f9;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--primary);
            color: white;
            border-radius: 8px;
        }
        .controls {
            max-width: 800px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        input[type="text"] {
            padding: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .stats-panel {
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #e8f6f3;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            border: 1px solid #d1f2eb;
            font-weight: bold;
            color: #16a085;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border-left: 5px solid var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .article-num {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1em;
        }
        .category-tag {
            background: #eee;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            color: #666;
        }
        .content {
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .fines {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .old-price {
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .new-price {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1em;
        }
        .no-fine {
            color: #27ae60;
            font-style: italic;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<header>
    <h1>Kanoun Agouni N'Teselent (1892)</h1>
    <p>Droit coutumier des Akbil numérisé et converti</p>
</header>

<div class="stats-panel" id="stats">
    Chargement des statistiques...
</div>

<div class="controls">
    <input type="text" id="searchInput" placeholder="Rechercher (ex: vol, femme, amin, guerre)...">
    <select id="categoryFilter">
        <option value="all">Toutes les catégories</option>
        <option value="Politique">Politique & Amin</option>
        <option value="Timecheret">Timecheret & Fêtes</option>
        <option value="Funérailles">Funérailles & Hospitalité</option>
        <option value="Guerre">Guerre & Défense</option>
        <option value="Civile">Discipline Civile & Corvées</option>
        <option value="Biens">Biens, Dettes & Héritage</option>
        <option value="Famille">Famille, Mariage & Femmes</option>
        <option value="Justice">Justice & Violence</option>
    </select>
</div>

<div class="grid" id="resultsGrid">
    </div>

<script>

        { id: 78, cat: "Justice", text: "Parricide/Fratricide pour héritage (destr. maison).", fine: "100 réaux", val: 100 * TAUX_REAL },
        { id: 79, cat: "Guerre", text: "Faire tuer un habitant par l'ennemi (exil 3 ans).", fine: "100 réaux", val: 100 * TAUX_REAL },
        { id: 82, cat: "Justice", text: "Homicide involontaire (non pour héritage).", fine: "12 réaux", val: 12 * TAUX_REAL },
        { id: 87, cat: "Justice", text: "Tirer un coup de fusil contre une maison.", fine: "20 réaux", val: 20 * TAUX_REAL },

        { id: 90, cat: "Justice", text: "Se rendre armé (fusil) à une rixe sans tirer.", fine: "5 réaux", val: 5 * TAUX_REAL },
        { id: 91, cat: "Justice", text: "Utiliser le fusil dans une rixe.", fine: "10 réaux", val: 10 * TAUX_REAL },
        { id: 92, cat: "Justice", text: "Frapper avec une massue.", fine: "5 réaux", val: 5 * TAUX_REAL },
        { id: 96, cat: "Justice", text: "Frapper avec bague à crochets (takhatem).", fine: "5 réaux", val: 5 * TAUX_REAL },
        { id: 100, cat: "Justice", text: "Frapper la femme d'autrui.", fine: "10 réaux", val: 10 * TAUX_REAL },
        { id: 101, cat: "Justice", text: "Saisir quelqu'un au collet (burnous).", fine: "1/2 réal", val: 0.5 * TAUX_REAL },
        { id: 102, cat: "Justice", text: "Violar Anaïa (paix) d'un tiers.", fine: "5 réaux", val: 5 * TAUX_REAL },
        { id: 103, cat: "Justice", text: "Violar Anaïa de l'amin ou notables.", fine: "10 réaux", val: 10 * TAUX_REAL },
        { id: 105, cat: "Justice", text: "Se battre avec l'amin.", fine: "2 réaux", val: 2 * TAUX_REAL },
        { id: 109, cat: "Justice", text: "Provoquer quelqu'un à sortir en campagne.", fine: "1 réal", val: 1 * TAUX_REAL }
    ];

    const grid = document.getElementById('resultsGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const statsPanel = document.getElementById('stats');

    function formatMoney(amount) {
        if (amount === null) return "Confiscation / Variable";
        return new Intl.NumberFormat('fr-DZ', { style: 'currency', currency: 'DZD' }).format(amount);
    }

    function renderCards(articles) {
        grid.innerHTML = '';
        if (articles.length === 0) {
            grid.innerHTML = '<p style="text-align:center; width:100%;">Aucun article trouvé.</p>';
            return;
        }

        articles.forEach(art => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="article-num">Article ${art.id}</span>
                        <span class="category-tag">${art.cat}</span>
                    </div>
                    <p class="content">${art.text}</p>
                </div>
                <div class="fines">
                    <span class="old-price">1892: ${art.fine}</span>
                    ${art.val !== 0 ? `<span class="new-price">${formatMoney(art.val)}</span>` : '<span class="no-fine">Pas d\'amende</span>'}
                </div>
            `;
            grid.appendChild(card);
        });
        updateStats(articles);
    }

    function updateStats(articles) {
        const count = articles.length;
        // Calcul simple de moyenne pour les amendes chiffrées
        let total = 0;
        let valid = 0;
        articles.forEach(a => {
            if(a.val) { total += a.val; valid++; }
        });
        const avg = valid > 0 ? Math.round(total / valid) : 0;
        statsPanel.innerHTML = `${count} articles affichés | Amende moyenne affichée : ${formatMoney(avg)}`;
    }

    function filterArticles() {
        const term = searchInput.value.toLowerCase();
        const cat = categoryFilter.value;

        const filtered = db.filter(art => {
            const matchesText = art.text.toLowerCase().includes(term) || art.id.toString().includes(term);
            const matchesCat = cat === 'all' || art.cat === cat;
            return matchesText && matchesCat;
        });

        renderCards(filtered);
    }

    // Event Listeners
    searchInput.addEventListener('input', filterArticles);
    categoryFilter.addEventListener('change', filterArticles);

    // Initial Render
    renderCards(db);

</script>

</body>
</html>
