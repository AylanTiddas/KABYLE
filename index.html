    // --- 2. LOGIQUE DE CALCUL ---
    function extractAndConvertFine(text) {
        // Regex pour capturer les montants
        const regexReal = /(\d+(?:[\.,]\d+)?)\s*réau?x?/i;
        const regexFranc = /(\d+(?:[\.,]\d+)?)\s*francs?/i;
        const regexCentime = /(\d+)\s*centimes?/i;
        // Cas speciaux fractions textuelles
        const regexHalfReal = /(un)?\s*demi[- ]réal/i;
        const regexQuarterReal = /(un)?\s*quart\s*de\s*réal/i;
        const regexEighthReal = /(un)?\s*huiti[èe]me\s*de\s*réal/i;
        const regexRealDemi = /un\s*réal\s*et\s*(un)?\s*demi/i;
        const regexRealQuart = /un\s*réal\s*et\s*un\s*quart/i;

        let totalDA = 0;
        let originalStr = "";
        let found = false;

        // Détection 1: "Un réal et demi"
        if(regexRealDemi.test(text)) {
            totalDA = 1.5 * RATE_REAL;
            originalStr = "1 réal et demi";
            found = true;
        }
        else if(regexRealQuart.test(text)) {
            totalDA = 1.25 * RATE_REAL;
            originalStr = "1 réal et quart";
            found = true;
        }
        // Détection 2: Fractions de Real
        else if (regexHalfReal.test(text) || text.includes("1/2 réal")) {
            totalDA = 0.5 * RATE_REAL;
            originalStr = "1/2 Réal";
            found = true;
        } else if (regexQuarterReal.test(text) || text.includes("1/4 de réal") || text.includes("1/4 réal")) {
            totalDA = 0.25 * RATE_REAL;
            originalStr = "1/4 Réal";
            found = true;
        } else if (regexEighthReal.test(text) || text.includes("1/8 de réal") || text.includes("1/8 réal")) {
            totalDA = 0.125 * RATE_REAL;
            originalStr = "1/8 Réal";
            found = true;
        }
        // Détection 3: X Réaux
        else if (text.match(regexReal)) {
            const match = text.match(regexReal);
            const val = parseFloat(match[1].replace(',', '.'));
            totalDA = val * RATE_REAL;
            originalStr = match[0];
            found = true;
        }
        // Détection 4: Francs (priorité basse si Real existe déjà, mais on additionne si le texte est complexe)
        else if (text.match(regexFranc)) {
            const match = text.match(regexFranc);
            const val = parseFloat(match[1].replace(',', '.'));
            totalDA = val * RATE_FRANC;
            originalStr = match[0];
            found = true;
        }
        // Détection 5: Centimes
        else if (text.match(regexCentime)) {
            const match = text.match(regexCentime);
            const val = parseInt(match[1]);
            // 100 centimes = 1 Franc = 500 DA -> 1 centime = 5 DA
            totalDA = val * (RATE_FRANC / 100);
            originalStr = match[0];
            found = true;
        }

        return found ? { da: Math.round(totalDA), original: originalStr } : null;
    }

    // --- 3. AFFICHAGE ---
    const grid = document.getElementById('appGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const statsBar = document.getElementById('statsBar');

    function formatMoney(amount) {
        return new Intl.NumberFormat('fr-DZ', { style: 'currency', currency: 'DZD', maximumFractionDigits: 0 }).format(amount);
    }

    function render(articles) {
        grid.innerHTML = '';
        let totalFines = 0;
        let countFines = 0;

        if (articles.length === 0) {
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#888;">Aucun article ne correspond à votre recherche.</div>';
            statsBar.innerHTML = "0 Article";
            return;
        }

        articles.forEach(art => {
            const fineData = extractAndConvertFine(art.text);
            const card = document.createElement('div');
            card.className = 'card';
            
            // Highlight keywords in text
            let displayText = art.text;
            if (searchInput.value.length > 2) {
                const regex = new RegExp(`(${searchInput.value})`, 'gi');
                displayText = displayText.replace(regex, '<span class="keyword-highlight">$1</span>');
            }

            // Déterminer la classe de catégorie pour la couleur
            let catClass = 'badge';
            if(art.cat === 'Politique') catClass += ' cat-politique';
            if(art.cat === 'Guerre') catClass += ' cat-guerre';
            if(art.cat === 'Famille') catClass += ' cat-famille';
            if(art.cat === 'Biens') catClass += ' cat-biens';
            if(art.cat.includes('Justice') || art.cat.includes('Violence')) catClass += ' cat-justice';

            let fineHTML = '';
            if (fineData) {
                fineHTML = `
                    <div class="footer-card">
                        <div class="fine-box">
                            <span class="fine-label">Amende 1892</span>
                            <span class="fine-original">${fineData.original}</span>
                        </div>
                        <div class="fine-box" style="text-align:right;">
                            <span class="fine-label">Équivalent Aujourd'hui</span>
                            <span class="fine-converted">${formatMoney(fineData.da)}</span>
                        </div>
                    </div>
                `;
                totalFines += fineData.da;
                countFines++;
            } else {
                fineHTML = `
                    <div class="footer-card" style="justify-content:center;">
                        <span style="color:#27ae60; font-style:italic; font-weight:bold;">Pas d'amende chiffrée / Variable</span>
                    </div>
                `;
            }

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="art-id">#${art.id}</span>
                        <span class="${catClass}">${art.cat}</span>
                    </div>
                    <p class="content">${displayText}</p>
                </div>
                ${fineHTML}
            `;
            grid.appendChild(card);
        });

        // Mise à jour des stats
        const avg = countFines > 0 ? Math.round(totalFines / countFines) : 0;
        statsBar.innerHTML = `${articles.length} articles affichés | Amende Moyenne: ${formatMoney(avg)}`;
    }

    function filterData() {
        const term = searchInput.value.toLowerCase();
        const cat = categoryFilter.value;

        const filtered = rawData.filter(art => {
            const matchesText = art.text.toLowerCase().includes(term) || art.id.toString() === term;
            const matchesCat = cat === 'all' || art.cat === cat || (cat === 'Vols' && art.cat === 'Vols');
            // Note: Le filtre catégorie est simple, j'ai mappé les valeurs du select aux données.
            // Pour les mappages complexes (ex: "Violence" dans le select vs "Justice" dans les données),
            // on peut affiner, mais ici les données rawData ont déjà des catégories propres.
            
            // Correction pour le filtre categorie qui ne matche pas toujours les cats dynamiques
            if (cat !== 'all' && art.cat !== cat) {
                 // Logique de regroupement si nécessaire
                 if (cat === 'Justice' && (art.cat === 'Justice')) return matchesText;
                 if (cat === 'Violence' && (art.cat === 'Violence')) return matchesText;
                 return false;
            }
            return matchesText;
        });

        render(filtered);
    }

    // --- 4. ÉVÉNEMENTS ---
    searchInput.addEventListener('input', filterData);
    categoryFilter.addEventListener('change', filterData);

    // Initialisation
    render(rawData);
